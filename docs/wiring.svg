  <text x="370" y="478" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8e1b1b" font-weight="600">Motor battery 6–12 V</text>
  <text x="20" y="650" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#333" font-weight="400">• All grounds (⏚) must be connected together: ESP32 GND, L293D pins 4, 5, 12, 13 and battery −.</text>
  <text x="20" y="666" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#333" font-weight="400">• Pin 16 (VCC1) = 5 V logic from the ESP32 5V/VIN pin. Pin 8 (VCC2) = motor battery, never the ESP32.</text>
  <text x="20" y="682" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#333" font-weight="400">• A motor spinning the wrong way: swap its two wires, or set REVERSE_A / REVERSE_B in the firmware.</text>
  <text x="20" y="698" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#333" font-weight="400">• L293D gets warm: max ~600 mA per motor. For bigger motors use an L298N or TB6612FNG (same pins).</text>
